# Portfolio Analyzer — every tunable threshold lives in this file.
# The app validates this file at startup and refuses to start if it is malformed.
# Edit, then restart the backend (or use Settings → Reload config in the UI, from Phase 8).

version: 1

defaults:
  style: null            # null = ask at onboarding
  risk: medium

# ---------------------------------------------------------------------------
# 5.1 Investing styles
# technical_weight + fundamental_weight must equal 1.0
# ---------------------------------------------------------------------------
styles:
  intraday:
    label: "Intraday / Short-term"
    horizon: "days"
    timeframes: ["15m", "1h", "1d"]
    technical_weight: 0.9
    fundamental_weight: 0.1
    note: "Yahoo Finance only provides ~60 days of 15-minute bars and ~730 days of hourly bars, and they may be delayed."
  swing:
    label: "Swing"
    horizon: "2 weeks – 3 months"
    timeframes: ["1d"]
    technical_weight: 0.7
    fundamental_weight: 0.3
  positional:
    label: "Positional"
    horizon: "3 – 12 months"
    timeframes: ["1d", "1wk"]
    technical_weight: 0.5
    fundamental_weight: 0.5
  long_term:
    label: "Long-term investing"
    horizon: "1+ years"
    timeframes: ["1wk", "1mo"]
    technical_weight: 0.2
    fundamental_weight: 0.8
  custom:
    label: "Custom"
    horizon: "user-defined"
    timeframes: ["1d"]
    technical_weight: 0.5    # overridden by the user's slider in Settings
    fundamental_weight: 0.5

# ---------------------------------------------------------------------------
# 5.2 Risk levels. Market cap and traded value in ₹ crore. null = no limit.
# ---------------------------------------------------------------------------
risk_levels:
  low:
    label: "Low"
    max_weight_per_stock: 0.08
    max_weight_per_sector: 0.25
    stop_loss_atr_multiple: 1.5
    min_market_cap_cr: 20000
    max_debt_to_equity: 0.5
    max_beta: 1.0
    buy_threshold: 75
  medium:
    label: "Medium"
    max_weight_per_stock: 0.12
    max_weight_per_sector: 0.30
    stop_loss_atr_multiple: 2.0
    min_market_cap_cr: 5000
    max_debt_to_equity: 1.0
    max_beta: 1.3
    buy_threshold: 70
  high:
    label: "High"
    max_weight_per_stock: 0.20
    max_weight_per_sector: 0.40
    stop_loss_atr_multiple: 3.0
    min_market_cap_cr: 1000
    max_debt_to_equity: 2.0
    max_beta: null
    buy_threshold: 65

# ---------------------------------------------------------------------------
# 7.4 Signal rules (composite score bands)
# ---------------------------------------------------------------------------
signals:
  strong_buy_margin: 10        # Strong Buy = composite >= buy_threshold + this
  hold_floor: 45               # Hold = hold_floor .. buy_threshold
  reduce_floor: 35             # Reduce = reduce_floor .. hold_floor
  severe_flags:
    max_pledge_pct: 25         # pledge above this % = severe red flag → Sell
    consecutive_loss_years: 2  # with rising debt = severe red flag

confidence:
  high_min_coverage: 0.8       # share of inputs available
  medium_min_coverage: 0.5

# ---------------------------------------------------------------------------
# Screener
# ---------------------------------------------------------------------------
screener:
  default_universe: nifty500
  min_avg_daily_traded_value_cr: 10
  top_n: 20
  request_delay_seconds: 0.5   # throttle between data requests

# ---------------------------------------------------------------------------
# Data sources (all free). Times are IST. Yahoo Finance prices are delayed;
# daily bars are stored only for completed sessions.
# ---------------------------------------------------------------------------
data:
  price_history_years: 5
  market_open_ist: "09:15"
  market_close_ist: "15:30"
  refresh_time_ist: "16:00"        # daily price refresh (Mon–Fri); a day's bar counts as final after this
  nav_refresh_time_ist: "23:30"    # AMFI publishes NAVs by 11 PM; NAV refresh runs daily after that
  refresh_on_startup: true         # catch up on stale data when the backend starts
  stale_after_hours: 24            # data not refreshed for this long is marked stale
  max_missing_sessions: 2          # weekdays a series may lag before it's flagged (covers exchange holidays)
  reference_refresh_days: 7        # NSE symbol / Nifty 500 lists are re-downloaded this often
  intraday_stale_after_minutes: 15
  intraday_max_days:               # Yahoo's limits on intraday history
    "15m": 59
    "1h": 729
  incremental_overlap_days: 7      # re-download this many recent days on each refresh
  split_check_tolerance: 0.02      # overlapping closes differing more than this ⇒ split/bonus ⇒ full re-download
  fundamentals_stale_after_days: 7
  http_timeout_seconds: 30
  http_retries: 3
  http_backoff_seconds: 2          # doubles on each retry
  rate_limits_per_minute:          # requests per source; be polite to free services
    yahoo: 60
    mfapi: 60
    nse: 10
    amfi: 10
  reference_min_rows:              # a downloaded list smaller than this is rejected as broken
    nse_equity: 1000
    nse_etf: 50
    nifty500: 450
    amfi_navall: 5000
  benchmarks:                      # Yahoo Finance index tickers
    nifty50: "^NSEI"
    nifty500: "^CRSLDX"

# ---------------------------------------------------------------------------
# 7.1 Technical engine: indicator periods and how readings are interpreted.
# Periods are in bars of the timeframe being analysed (days on 1d, weeks on 1wk …).
# ---------------------------------------------------------------------------
technical:
  periods:
    sma: [20, 50, 200]
    ema: [9, 21]
    adx: 14
    supertrend: {period: 10, multiplier: 3}
    rsi: 14
    macd: {fast: 12, slow: 26, signal: 9}
    stochastic: {k: 14, smooth: 3, d: 3}
    roc: 20
    bollinger: {period: 20, std: 2}
    atr: 14
    hist_vol: 20
    volume_avg: 20
    obv_trend: 20
    high_low_sessions: 252          # 52 weeks of daily bars
    relative_strength: {3m: 63, 6m: 126}   # sessions, vs the nifty50 benchmark
    delivery_avg: 20                # sessions
  thresholds:
    rsi_overbought: 70
    rsi_oversold: 30
    rsi_neutral_band: [45, 55]      # RSI inside this band reads as neutral momentum
    stoch_overbought: 80
    stoch_oversold: 20
    adx_trending: 25                # ADX at or above this = a trend worth following
    adx_weak: 20                    # below this = no clear trend
    cross_lookback_bars: 10         # a cross this recent is reported as "fresh"
    volume_surge: 1.5               # volume / 20-bar average
    near_52w_pct: 5                 # within this % of the 52-week high/low
    squeeze_lookback_bars: 120      # Bollinger bandwidth at its lowest in this window = squeeze
    delivery_surge: 1.2             # delivery % / its 20-session average
    obv_slope_min: 0.02             # |OBV trend| (share of average volume per bar) below this is flat
    candle_doji_body: 0.1           # body ≤ this share of the day's range
    candle_hammer_shadow: 2.0       # lower shadow ≥ this × body
  support_resistance:
    lookback_bars: 250
    pivot_window: 5                 # bars each side for a swing high/low
    cluster_pct: 1.5                # pivots within this % of each other form one level
    min_touches: 2
    breakout_buffer_pct: 1.0        # close must clear the level by this much
    breakout_window_bars: 3         # breakouts in the last N bars are reported
  delivery_lookback_sessions: 21    # NSE bhavcopy files fetched: the latest + periods.delivery_avg before it

# ---------------------------------------------------------------------------
# 7.2 Fundamental engine. Percentages are in percent (15 = 15%).
# ---------------------------------------------------------------------------
fundamental:
  # Sectors (NSE industry or Yahoo sector names) where debt/equity, current ratio, EV/EBITDA,
  # ROCE and gross-margin tests don't apply: lending is a bank's business, not a risk signal.
  financial_sectors: ["Financial Services", "Banks", "Insurance"]
  sector_min_peers: 5            # fewer cached peers than this ⇒ no sector median
  sector_max_peers: 40           # peers fetched per sector by the peer refresh
  refresh_day: "sat"             # weekly fundamentals + peers refresh (Yahoo updates quarterly)
  refresh_time_ist: "10:00"
  screener_max_age_days: 120     # Screener.in uploads older than this are ignored (one quarter + slack)
  cross_check_tolerance: 0.25    # our P/E, P/B, EV/EBITDA vs Yahoo's own: differ by more ⇒ shown as a data warning
  thresholds:
    valuation_cheap_ratio: 0.8   # P/E, P/B, EV/EBITDA ≤ 0.8 × sector median ⇒ cheaper than peers
    valuation_rich_ratio: 1.2    # ≥ 1.2 × sector median ⇒ pricier than peers
    peg_cheap: 1.0
    peg_rich: 2.0
    roe_good: 15
    roe_poor: 8
    roce_good: 15
    roce_poor: 8
    margin_trend_flat_pp: 1.0    # 3-year margin change within ±1 percentage point ⇒ stable
    growth_good: 15              # revenue / profit CAGR
    growth_poor: 0
    quarter_yoy_good: 10
    quarter_yoy_poor: 0
    debt_equity_low: 0.3         # the upper limit comes from your risk level (max_debt_to_equity)
    interest_coverage_good: 5
    interest_coverage_poor: 2
    current_ratio_good: 1.5
    current_ratio_poor: 1.0
    dividend_yield_high: 3
    fscore_strong: 7
    fscore_weak: 3
    promoter_change_pp: 1.0      # promoter stake change (percentage points) worth flagging
    pledge_warn_pct: 10          # pledge above this is a warning (severe: signals.severe_flags)
    institution_change_pp: 1.0   # FII / DII stake change worth flagging

# ---------------------------------------------------------------------------
# Importers (fuzzy-match scores are 0–100)
# ---------------------------------------------------------------------------
importing:
  header_scan_rows: 40             # how far down a file to look for the real header row
  column_match_min_score: 80       # header text vs known column names
  min_header_matches: 3            # a row needs this many recognised columns to count as the header
  ticker_name_auto_accept: 92      # company-name match accepted without asking
  ticker_name_suggest: 70          # weaker matches are offered as suggestions only
  scheme_name_auto_accept: 90      # MF scheme-name match accepted without asking
  scheme_name_suggest: 70
  max_suggestions: 5
  max_upload_mb: 15

# ---------------------------------------------------------------------------
# Tax (India). VERIFY CURRENT RATES before relying on these — they change with each Budget.
# ---------------------------------------------------------------------------
tax:
  verify_note: "Tax rates change with each Union Budget. Verify current rates with a tax professional."
  equity_ltcg_min_holding_days: 365
  equity_stcg_rate: 0.20
  equity_ltcg_rate: 0.125
  equity_ltcg_exemption_inr: 125000

disclaimer: >-
  Signals are generated by rules from public data. This is not investment advice.
  Consult a SEBI-registered investment adviser before acting.
