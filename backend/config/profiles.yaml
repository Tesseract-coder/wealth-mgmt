# Portfolio Analyzer — every tunable threshold lives in this file.
# The app validates this file at startup and refuses to start if it is malformed.
# Edit, then restart the backend (or use Settings → Reload config in the UI, from Phase 8).

version: 1

defaults:
  style: null            # null = ask at onboarding
  risk: medium

# ---------------------------------------------------------------------------
# 5.1 Investing styles
# technical_weight + fundamental_weight must equal 1.0
# ---------------------------------------------------------------------------
styles:
  intraday:
    label: "Intraday / Short-term"
    horizon: "days"
    timeframes: ["15m", "1h", "1d"]
    technical_weight: 0.9
    fundamental_weight: 0.1
    note: "Yahoo Finance only provides ~60 days of 15-minute bars and ~730 days of hourly bars, and they may be delayed."
  swing:
    label: "Swing"
    horizon: "2 weeks – 3 months"
    timeframes: ["1d"]
    technical_weight: 0.7
    fundamental_weight: 0.3
  positional:
    label: "Positional"
    horizon: "3 – 12 months"
    timeframes: ["1d", "1wk"]
    technical_weight: 0.5
    fundamental_weight: 0.5
  long_term:
    label: "Long-term investing"
    horizon: "1+ years"
    timeframes: ["1wk", "1mo"]
    technical_weight: 0.2
    fundamental_weight: 0.8
  custom:
    label: "Custom"
    horizon: "user-defined"
    timeframes: ["1d"]
    technical_weight: 0.5    # overridden by the user's slider in Settings
    fundamental_weight: 0.5

# ---------------------------------------------------------------------------
# 5.2 Risk levels. Market cap and traded value in ₹ crore. null = no limit.
# ---------------------------------------------------------------------------
risk_levels:
  low:
    label: "Low"
    max_weight_per_stock: 0.08
    max_weight_per_sector: 0.25
    stop_loss_atr_multiple: 1.5
    min_market_cap_cr: 20000
    max_debt_to_equity: 0.5
    max_beta: 1.0
    buy_threshold: 75
  medium:
    label: "Medium"
    max_weight_per_stock: 0.12
    max_weight_per_sector: 0.30
    stop_loss_atr_multiple: 2.0
    min_market_cap_cr: 5000
    max_debt_to_equity: 1.0
    max_beta: 1.3
    buy_threshold: 70
  high:
    label: "High"
    max_weight_per_stock: 0.20
    max_weight_per_sector: 0.40
    stop_loss_atr_multiple: 3.0
    min_market_cap_cr: 1000
    max_debt_to_equity: 2.0
    max_beta: null
    buy_threshold: 65

# ---------------------------------------------------------------------------
# 7.4 Signal rules (composite score bands)
# ---------------------------------------------------------------------------
signals:
  strong_buy_margin: 10        # Strong Buy = composite >= buy_threshold + this
  hold_floor: 45               # Hold = hold_floor .. buy_threshold
  reduce_floor: 35             # Reduce = reduce_floor .. hold_floor
  severe_flags:
    max_pledge_pct: 25         # pledge above this % = severe red flag → Sell
    consecutive_loss_years: 2  # with rising debt = severe red flag

confidence:
  high_min_coverage: 0.8       # share of inputs available
  medium_min_coverage: 0.5

# ---------------------------------------------------------------------------
# Screener
# ---------------------------------------------------------------------------
screener:
  default_universe: nifty500
  min_avg_daily_traded_value_cr: 10
  top_n: 20
  request_delay_seconds: 0.5   # throttle between data requests

# ---------------------------------------------------------------------------
# Data sources
# ---------------------------------------------------------------------------
data:
  price_history_years: 5
  stale_after_hours: 24
  fundamentals_stale_after_days: 7
  max_requests_per_minute: 60
  refresh_time_ist: "16:00"    # daily refresh after market close

# ---------------------------------------------------------------------------
# Tax (India). VERIFY CURRENT RATES before relying on these — they change with each Budget.
# ---------------------------------------------------------------------------
tax:
  verify_note: "Tax rates change with each Union Budget. Verify current rates with a tax professional."
  equity_ltcg_min_holding_days: 365
  equity_stcg_rate: 0.20
  equity_ltcg_rate: 0.125
  equity_ltcg_exemption_inr: 125000

disclaimer: >-
  Signals are generated by rules from public data. This is not investment advice.
  Consult a SEBI-registered investment adviser before acting.
