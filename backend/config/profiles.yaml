# Portfolio Analyzer — every tunable threshold lives in this file.
# The app validates this file at startup and refuses to start if it is malformed.
# Edit, then restart the backend (or use Settings → Reload config in the UI, from Phase 8).

version: 1

defaults:
  style: null            # null = ask at onboarding
  risk: medium

# ---------------------------------------------------------------------------
# 5.1 Investing styles
# technical_weight + fundamental_weight must equal 1.0
# stop_breach_exits: a close below the ATR trailing stop forces Sell / Exit. When false the
# breach is a red flag (blocks Buy) but not an exit: long-term holders ride out pullbacks.
# ---------------------------------------------------------------------------
styles:
  intraday:
    label: "Intraday / Short-term"
    horizon: "days"
    timeframes: ["15m", "1h", "1d"]
    technical_weight: 0.9
    fundamental_weight: 0.1
    note: "Yahoo Finance only provides ~60 days of 15-minute bars and ~730 days of hourly bars, and they may be delayed."
  swing:
    label: "Swing"
    horizon: "2 weeks – 3 months"
    timeframes: ["1d"]
    technical_weight: 0.7
    fundamental_weight: 0.3
  positional:
    label: "Positional"
    horizon: "3 – 12 months"
    timeframes: ["1d", "1wk"]
    technical_weight: 0.5
    fundamental_weight: 0.5
  long_term:
    label: "Long-term investing"
    horizon: "1+ years"
    timeframes: ["1wk", "1mo"]
    technical_weight: 0.2
    fundamental_weight: 0.8
    stop_breach_exits: false
  custom:
    label: "Custom"
    horizon: "user-defined"
    timeframes: ["1d"]
    technical_weight: 0.5    # overridden by the user's slider in Settings
    fundamental_weight: 0.5

# ---------------------------------------------------------------------------
# 5.2 Risk levels. Market cap and traded value in ₹ crore. null = no limit.
# ---------------------------------------------------------------------------
risk_levels:
  low:
    label: "Low"
    max_weight_per_stock: 0.08
    max_weight_per_sector: 0.25
    stop_loss_atr_multiple: 1.5
    min_market_cap_cr: 20000
    max_debt_to_equity: 0.5
    max_beta: 1.0
    buy_threshold: 75
  medium:
    label: "Medium"
    max_weight_per_stock: 0.12
    max_weight_per_sector: 0.30
    stop_loss_atr_multiple: 2.0
    min_market_cap_cr: 5000
    max_debt_to_equity: 1.0
    max_beta: 1.3
    buy_threshold: 70
  high:
    label: "High"
    max_weight_per_stock: 0.20
    max_weight_per_sector: 0.40
    stop_loss_atr_multiple: 3.0
    min_market_cap_cr: 1000
    max_debt_to_equity: 2.0
    max_beta: null
    buy_threshold: 65

# ---------------------------------------------------------------------------
# 7.4 Signal rules (composite score bands)
# ---------------------------------------------------------------------------
signals:
  strong_buy_margin: 10        # Strong Buy = composite >= buy_threshold + this
  hold_floor: 45               # Hold = hold_floor .. buy_threshold
  reduce_floor: 35             # Reduce = reduce_floor .. hold_floor
  severe_flags:
    max_pledge_pct: 25         # pledge above this % = severe red flag → Sell
    consecutive_loss_years: 2  # with rising debt = severe red flag
  stop_loss_lookback_bars: 22  # trailing stop = highest high of the last N bars − ATR multiple × ATR
  target_r_multiples: [2, 3]   # targets at entry + 2R and + 3R, where R = ATR multiple × ATR

confidence:
  high_min_coverage: 0.8       # share of the score's inputs that had data
  medium_min_coverage: 0.5
  stale_caps_at: medium        # stale prices or fundamentals: confidence is at most this

# ---------------------------------------------------------------------------
# 7.3 Scoring. Each sub-score is 0–100, built from the engine's readings:
#   sub-score = 50 + 50 × Σ(direction × weight) / Σ(weight)
# where direction is +1 bullish, −1 bearish, 0 neutral. All bullish → 100, all bearish → 0,
# balanced or all neutral → 50. A sub-score with no readings is "no data": it is left out
# and the rest re-weighted, and the gap lowers confidence instead of the score.
# ---------------------------------------------------------------------------
scoring:
  technical_weights:           # sub-score weights inside the technical score (re-normalised)
    trend: 0.30
    momentum: 0.20
    volume: 0.15
    structure: 0.15
    relative_strength: 0.20
    volatility: 0.0            # volatility sets the stop-loss distance; it isn't a direction
    pattern: 0.0               # candlestick patterns: shown as reasons only, not scored
  fundamental_weights:
    valuation: 0.20
    profitability: 0.20
    growth: 0.20
    health: 0.20
    quality: 0.10
    ownership: 0.10
  # Categories that don't apply to lenders/insurers; missing them doesn't cut confidence.
  financial_exempt: ["health", "quality"]
  primary_timeframe_weight: 0.6  # the style's first timeframe; the rest share what's left
  minor_weight: 0.5              # weak evidence (candles, Bollinger stretch, small signs)
  neutral_weight: 0.5            # a neutral reading pulls its sub-score toward 50 this much
  # Readings that describe rather than judge (ATR size, the level map): not scored.
  info_only: ["atr", "hist_vol", "levels", "pe_value", "pb_value", "ev_ebitda_value",
              "fscore_partial"]
  # Stronger evidence counts more (default 1.0).
  reading_weights:
    golden_cross: 2.0
    death_cross: 2.0
    adx_strong_trend: 1.5
    breakout: 1.5
    breakdown: 1.5
    debt_above_limit: 2.0
    loss_making: 2.0
    fscore_strong: 1.5
    fscore_weak: 1.5
    pledge_high: 1.5
    pledge_severe: 3.0
    promoter_selling: 1.5
  beta_lookback_sessions: 252    # beta vs Nifty 50 from a year of daily returns
  beta_min_sessions: 120

# ---------------------------------------------------------------------------
# 7.4 Position sizing. Weights are shares of the whole portfolio (stocks + mutual funds)
# unless weight_base is "stocks". Suggested quantities: adds use new money, trims take
# money out (so the rest of the portfolio's weights stay comparable).
# ---------------------------------------------------------------------------
rebalance:
  weight_base: portfolio         # "portfolio" (stocks + funds) or "stocks"
  strong_buy_target: 1.0         # Strong Buy: add up to this × max weight per stock
  buy_target: 0.75               # Buy: add up to this × max weight per stock
  reduce_keep: 0.5               # Reduce on a weak score: trim to this share of the position
  min_trade_value_inr: 1000      # smaller suggested trades are dropped as noise

# ---------------------------------------------------------------------------
# 7.5 Mutual funds. Returns in percent a year unless noted.
# ---------------------------------------------------------------------------
mf:
  risk_free_rate_pct: 6.5          # for Sharpe/Sortino: roughly the 91-day T-bill yield. VERIFY and update.
  risk_stats_years: 3              # volatility, Sharpe, Sortino, drawdown over this window (or all history if shorter)
  min_history_days: 365            # less NAV history than this: no risk stats
  rolling_windows_years: [1, 3]    # rolling CAGR windows compared with the benchmark
  rolling_step_days: 7             # one window starting every N days
  # Category benchmarks: first entry whose keywords appear in the fund's category (or name for
  # index funds/ETFs) wins. Yahoo has price indices only, without dividends, so funds look
  # ~1–1.5% a year better than against the official total-return index.
  benchmarks:
    - {match: ["nifty next 50", "next 50"], ticker: "^NSMIDCP", label: "Nifty Next 50"}
    - {match: ["nifty 50", "nifty50", "sensex"], ticker: "^NSEI", label: "Nifty 50"}
    - {match: ["nifty 500", "nifty500"], ticker: "^CRSLDX", label: "Nifty 500"}
    - {match: ["bank"], ticker: "^NSEBANK", label: "Nifty Bank"}
    - {match: ["small cap", "smallcap"], ticker: "NIFTYSMLCAP250.NS", label: "Nifty Smallcap 250"}
    - {match: ["large & mid", "large and mid"], ticker: "^CRSLDX", label: "Nifty 500 (proxy for LargeMidcap 250)"}
    - {match: ["mid cap", "midcap"], ticker: "NIFTYMIDCAP150.NS", label: "Nifty Midcap 150"}
    - {match: ["large cap", "largecap"], ticker: "^NSEI", label: "Nifty 50"}
    - {match: ["flexi cap", "multi cap", "elss", "focused", "value", "contra", "dividend yield", "tax saver"], ticker: "^CRSLDX", label: "Nifty 500"}
  # Asset class from the AMFI category (first match wins; anything else is equity). Debt and
  # "other" funds get no equity benchmark.
  asset_classes:
    debt: ["debt", "income", "liquid", "gilt", "money market", "overnight", "bond", "credit risk",
           "duration", "floater", "floating", "banking and psu", "fixed maturity", "fmp"]
    hybrid: ["hybrid", "arbitrage", "balanced", "asset allocation", "equity savings"]
    other: ["fof overseas", "overseas", "international", "global", "gold", "silver", "fund of funds"]
  overlap_high_pct: 50             # two of your funds sharing more than this ⇒ Review
  overlap_min_coverage_pct: 90     # factsheet weights summing to less ⇒ overlap marked approximate
  portfolio_max_age_days: 100      # factsheet holdings older than this ⇒ approximate
  duplicate_category_max: 2        # more funds than this in one category ⇒ warning (e.g. 3 large-cap funds)
  expense_ratio_high_pct:          # TER above this (from your input) ⇒ Review. Direct-plan levels.
    equity: 1.0
    debt: 0.5
    other: 1.0
  signals:
    review_rolling_excess_pp: -1.0   # average rolling 3y excess return below this ⇒ Review
    switch_rolling_excess_pp: -3.0   # …below this, and beating the benchmark in few windows ⇒ Switch
    switch_max_beat_share: 0.3       # share of rolling 3y windows the fund beat the benchmark
    review_1y_excess_pp: -5.0        # last year behind the benchmark by more ⇒ Review
    regular_plan_switch: true        # Regular plan with a Direct twin ⇒ Switch (mind exit load and tax)

# ---------------------------------------------------------------------------
# 7.6 Portfolio analytics
# ---------------------------------------------------------------------------
portfolio:
  # Market-cap buckets in ₹ crore. SEBI uses AMFI's half-yearly ranking (top 100 large,
  # 101–250 mid); these cut-offs approximate it. VERIFY against AMFI's latest list.
  large_cap_min_cr: 100000
  mid_cap_min_cr: 33000
  correlation_top_n: 10
  correlation_lookback_sessions: 252
  performance_min_days: 30         # fewer days since your first snapshot ⇒ show the last year instead
  performance_fallback_days: 365
  xirr_min_coverage: 0.5           # XIRR covering less of the portfolio than this is marked partial
  top_n_concentration: 5           # "your top 5 holdings are X% of the portfolio"

# ---------------------------------------------------------------------------
# 8. Screener
# ---------------------------------------------------------------------------
# A scan downloads (or reads from the cache) prices and fundamentals for every stock in the
# universe, scores each with your style and risk, and stores the result. Presets and your own
# screens then filter that stored scan instantly; a new scan is needed only for fresh data.
# Filters use daily bars and the latest fundamentals. A stock with no value for a filter's field
# fails that filter (the app never assumes), except fields that don't apply to lenders and
# insurers (debt/equity, ROCE, EV/EBITDA …): financials pass those.
# Ops: gt, gte, lt, lte, between ([low, high], inclusive). Fields: see GET /screener/fields.
# ---------------------------------------------------------------------------
screener:
  default_universe: nifty500       # nifty50 | nifty100 | nifty200 | nifty500 | custom
  min_avg_daily_traded_value_cr: 10  # liquidity pre-filter: average close × volume
  traded_value_sessions: 20        # …over this many sessions
  min_history_sessions: 60         # fewer daily bars than this (recent listings): not scored
  top_n: 20
  request_delay_seconds: 0.5       # extra pause after each stock that needed a download
  custom_universe_max: 500         # symbols allowed in a custom list
  entry_zone_atr: 0.5              # entry zone: from close − this × ATR (or the nearest support, if higher) up to the close
  keep_scans: 10                   # older stored scans are deleted
  exclude_signals: [sell, reduce]  # the engine says avoid these, so they are never shown as ideas
  presets:
    top_scores:
      label: "Top scores"
      description: "No extra filters: the best composite scores that pass your risk pre-filters."
      filters: []
    quality_fair_price:
      label: "Quality at fair price"
      description: "High ROE and ROCE, low debt, P/E at or below the sector median."
      filters:
        - {field: roe, op: gte, value: 15}
        - {field: roce, op: gte, value: 15}
        - {field: debt_equity, op: lte, value: 0.5}
        - {field: pe_vs_sector, op: lte, value: 1.0}
    momentum_breakout:
      label: "Momentum breakout"
      description: "Above the 50- and 200-DMA, within 5% of the 52-week high, volume surge, ADX above 25."
      filters:
        - {field: price_vs_sma50_pct, op: gt, value: 0}
        - {field: price_vs_sma200_pct, op: gt, value: 0}
        - {field: pct_below_52w_high, op: lte, value: 5}
        - {field: volume_ratio, op: gte, value: 1.5}
        - {field: adx, op: gt, value: 25}
    pullback_uptrend:
      label: "Pullback in uptrend"
      description: "Above the 200-DMA, RSI 35–45, within 3% of the 50-DMA (support)."
      filters:
        - {field: price_vs_sma200_pct, op: gt, value: 0}
        - {field: rsi, op: between, value: [35, 45]}
        - {field: price_vs_sma50_pct, op: between, value: [-3, 3]}
    growth:
      label: "Growth"
      description: "Revenue and profit CAGR (3y) above 15%, operating margin improving."
      filters:
        - {field: revenue_cagr_3y, op: gt, value: 15}
        - {field: profit_cagr_3y, op: gt, value: 15}
        - {field: op_margin_change, op: gt, value: 0}
    dividend_value:
      label: "Dividend + value"
      description: "Dividend yield of 3% or more, P/E at or below the sector median, positive free cash flow in at least 2 of the last 3 years."
      filters:
        - {field: dividend_yield, op: gte, value: 3}
        - {field: pe_vs_sector, op: lte, value: 1.0}
        - {field: fcf_positive_years, op: gte, value: 2}

# ---------------------------------------------------------------------------
# Data sources (all free). Times are IST. Yahoo Finance prices are delayed;
# daily bars are stored only for completed sessions.
# ---------------------------------------------------------------------------
data:
  price_history_years: 5
  market_open_ist: "09:15"
  market_close_ist: "15:30"
  refresh_time_ist: "16:00"        # daily price refresh (Mon–Fri); a day's bar counts as final after this
  nav_refresh_time_ist: "23:30"    # AMFI publishes NAVs by 11 PM; NAV refresh runs daily after that
  refresh_on_startup: true         # catch up on stale data when the backend starts
  stale_after_hours: 24            # data not refreshed for this long is marked stale
  max_missing_sessions: 2          # weekdays a series may lag before it's flagged (covers exchange holidays)
  reference_refresh_days: 7        # NSE symbol / Nifty 500 lists are re-downloaded this often
  intraday_stale_after_minutes: 15
  intraday_max_days:               # Yahoo's limits on intraday history
    "15m": 59
    "1h": 729
  incremental_overlap_days: 7      # re-download this many recent days on each refresh
  split_check_tolerance: 0.02      # overlapping closes differing more than this ⇒ split/bonus ⇒ full re-download
  fundamentals_stale_after_days: 7
  http_timeout_seconds: 30
  http_retries: 3
  http_backoff_seconds: 2          # doubles on each retry
  rate_limits_per_minute:          # requests per source; be polite to free services
    yahoo: 60
    mfapi: 60
    nse: 10
    amfi: 10
    google: 50                     # Sheets API allows 60 requests/min per user; stay under it
  reference_min_rows:              # a downloaded list smaller than this is rejected as broken
    nse_equity: 1000
    nse_etf: 50
    nifty50: 45
    nifty100: 90
    nifty200: 180
    nifty500: 450
    amfi_navall: 5000
  benchmarks:                      # Yahoo Finance index tickers
    nifty50: "^NSEI"
    nifty500: "^CRSLDX"

# ---------------------------------------------------------------------------
# 7.1 Technical engine: indicator periods and how readings are interpreted.
# Periods are in bars of the timeframe being analysed (days on 1d, weeks on 1wk …).
# ---------------------------------------------------------------------------
technical:
  periods:
    sma: [20, 50, 200]
    ema: [9, 21]
    adx: 14
    supertrend: {period: 10, multiplier: 3}
    rsi: 14
    macd: {fast: 12, slow: 26, signal: 9}
    stochastic: {k: 14, smooth: 3, d: 3}
    roc: 20
    bollinger: {period: 20, std: 2}
    atr: 14
    hist_vol: 20
    volume_avg: 20
    obv_trend: 20
    high_low_sessions: 252          # 52 weeks of daily bars
    relative_strength: {3m: 63, 6m: 126}   # sessions, vs the nifty50 benchmark
    delivery_avg: 20                # sessions
  thresholds:
    rsi_overbought: 70
    rsi_oversold: 30
    rsi_neutral_band: [45, 55]      # RSI inside this band reads as neutral momentum
    stoch_overbought: 80
    stoch_oversold: 20
    adx_trending: 25                # ADX at or above this = a trend worth following
    adx_weak: 20                    # below this = no clear trend
    cross_lookback_bars: 10         # a cross this recent is reported as "fresh"
    volume_surge: 1.5               # volume / 20-bar average
    near_52w_pct: 5                 # within this % of the 52-week high/low
    squeeze_lookback_bars: 120      # Bollinger bandwidth at its lowest in this window = squeeze
    delivery_surge: 1.2             # delivery % / its 20-session average
    obv_slope_min: 0.02             # |OBV trend| (share of average volume per bar) below this is flat
    candle_doji_body: 0.1           # body ≤ this share of the day's range
    candle_hammer_shadow: 2.0       # lower shadow ≥ this × body
  support_resistance:
    lookback_bars: 250
    pivot_window: 5                 # bars each side for a swing high/low
    cluster_pct: 1.5                # pivots within this % of each other form one level
    min_touches: 2
    breakout_buffer_pct: 1.0        # close must clear the level by this much
    breakout_window_bars: 3         # breakouts in the last N bars are reported
  patterns:                         # classic chart patterns (informational: not in the score)
    lookback_bars: 250
    pivot_windows: [3, 6]           # swing scales tried: small and large patterns
    peak_tolerance_pct: 3.0         # two tops/bottoms count as equal within this %
    min_depth_pct: 4.0              # the dip between two tops (or rise between bottoms)
    head_min_pct: 2.0               # how far the head must stand beyond the shoulders
    flat_slope_pct: 0.06            # a trendline moving less than this % per bar is flat
    breakout_buffer_pct: 0.5        # a close must clear the line by this much
    recent_breakout_bars: 10        # confirmed patterns are shown for this many bars
    pole_atr: 4.0                   # flag/pennant pole: a move of at least this many ATRs
    pole_max_bars: 15
    flag_bars: [4, 20]              # length of the flag or pennant after the pole
    cup_depth_pct: [10.0, 50.0]
    rounding_min_depth_pct: 10.0
    min_confidence: 50              # weaker matches are not shown
  delivery_lookback_sessions: 21    # NSE bhavcopy files fetched: the latest + periods.delivery_avg before it

# ---------------------------------------------------------------------------
# 7.2 Fundamental engine. Percentages are in percent (15 = 15%).
# ---------------------------------------------------------------------------
fundamental:
  # Sectors (NSE industry or Yahoo sector names) where debt/equity, current ratio, EV/EBITDA,
  # ROCE and gross-margin tests don't apply: lending is a bank's business, not a risk signal.
  financial_sectors: ["Financial Services", "Banks", "Insurance"]
  sector_min_peers: 5            # fewer cached peers than this ⇒ no sector median
  sector_max_peers: 40           # peers fetched per sector by the peer refresh
  refresh_day: "sat"             # weekly fundamentals + peers refresh (Yahoo updates quarterly)
  refresh_time_ist: "10:00"
  screener_max_age_days: 120     # Screener.in uploads older than this are ignored (one quarter + slack)
  cross_check_tolerance: 0.25    # our P/E, P/B, EV/EBITDA vs Yahoo's own: differ by more ⇒ shown as a data warning
  thresholds:
    valuation_cheap_ratio: 0.8   # P/E, P/B, EV/EBITDA ≤ 0.8 × sector median ⇒ cheaper than peers
    valuation_rich_ratio: 1.2    # ≥ 1.2 × sector median ⇒ pricier than peers
    peg_cheap: 1.0
    peg_rich: 2.0
    roe_good: 15
    roe_poor: 8
    roce_good: 15
    roce_poor: 8
    margin_trend_flat_pp: 1.0    # 3-year margin change within ±1 percentage point ⇒ stable
    growth_good: 15              # revenue / profit CAGR
    growth_poor: 0
    quarter_yoy_good: 10
    quarter_yoy_poor: 0
    debt_equity_low: 0.3         # the upper limit comes from your risk level (max_debt_to_equity)
    interest_coverage_good: 5
    interest_coverage_poor: 2
    current_ratio_good: 1.5
    current_ratio_poor: 1.0
    dividend_yield_high: 3
    fscore_strong: 7
    fscore_weak: 3
    promoter_change_pp: 1.0      # promoter stake change (percentage points) worth flagging
    pledge_warn_pct: 10          # pledge above this is a warning (severe: signals.severe_flags)
    institution_change_pp: 1.0   # FII / DII stake change worth flagging

# ---------------------------------------------------------------------------
# Google Sheets (see docs/GOOGLE_SHEETS_SETUP.md). Export writes ONLY the tabs named under
# export_tabs, creating them if missing; your other tabs are never touched. A tab with the
# same name that this app didn't create is left alone unless you confirm the overwrite.
# ---------------------------------------------------------------------------
sheets:
  export_tabs:
    stocks: Analysis_Stocks
    mf: Analysis_MF
    screener: Screener
    summary: Summary
  import_tabs:                     # tabs read by "Import from my sheet" (you can type others)
    stocks: Holdings_Stocks
    mf: Holdings_MF
  max_import_rows: 5000            # a tab or CSV larger than this is refused
  summary_actions: 5               # top actions listed on the Summary tab

# ---------------------------------------------------------------------------
# Backtest helper (Analysis → Backtest). Replays the TECHNICAL rules over past prices. It is a
# historical test only: it doesn't predict the future, and fundamentals aren't replayed
# because their point-in-time history isn't available from free sources.
# ---------------------------------------------------------------------------
backtest:
  years: 3                         # how far back to replay
  step_sessions: 5                 # evaluate the rules every N sessions (5 = weekly)
  warmup_sessions: 260             # history needed before the first evaluation (200-DMA, 52-week range)
  horizon_sessions:                # forward window for "was the signal right?", per style
    intraday: 5
    swing: 20
    positional: 60
    long_term: 120
    custom: 20

# ---------------------------------------------------------------------------
# Report (Settings → Export → Portfolio report: HTML, print to PDF)
# ---------------------------------------------------------------------------
report:
  top_reasons: 2                   # bullish / bearish reasons per stock
  actions: 10                      # "Action needed" items listed
  screener_ideas: 10               # top screener ideas listed (when a scan exists)

# ---------------------------------------------------------------------------
# Importers (fuzzy-match scores are 0–100)
# ---------------------------------------------------------------------------
importing:
  header_scan_rows: 40             # how far down a file to look for the real header row
  column_match_min_score: 80       # header text vs known column names
  min_header_matches: 3            # a row needs this many recognised columns to count as the header
  ticker_name_auto_accept: 92      # company-name match accepted without asking
  ticker_name_suggest: 70          # weaker matches are offered as suggestions only
  scheme_name_auto_accept: 90      # MF scheme-name match accepted without asking
  scheme_name_suggest: 70
  max_suggestions: 5
  max_upload_mb: 15

# ---------------------------------------------------------------------------
# Tax (India). VERIFY CURRENT RATES before relying on these — they change with each Budget.
# ---------------------------------------------------------------------------
tax:
  verify_note: "Tax rates change with each Union Budget. Verify current rates with a tax professional."
  equity_ltcg_min_holding_days: 365
  equity_stcg_rate: 0.20
  equity_ltcg_rate: 0.125
  equity_ltcg_exemption_inr: 125000

disclaimer: >-
  Signals are generated by rules from public data. This is not investment advice.
  Consult a SEBI-registered investment adviser before acting.
